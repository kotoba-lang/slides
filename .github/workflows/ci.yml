name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kotoba-ui / appkit / shitsuke / liquid-glass-ui are :local/root
      # west-sibling deps (deps.edn — kotoba-ui itself pins shitsuke and
      # liquid-glass-ui as :local/root, so the whole design-system stack
      # rides as siblings). Clone them next to this checkout.
      - name: Check out design-system siblings
        run: |
          for repo in shitsuke liquid-glass-ui kotoba-ui appkit; do
            git clone --depth 1 https://github.com/kotoba-lang/$repo ../$repo
          done

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Test CLJC
        run: clojure -M:test
      - name: Lint
        run: clojure -M:lint
      - name: Coverage gate
        run: clojure -M:coverage && clojure -M:coverage-thresholds
      - name: Build GitHub Pages
        run: clojure -M:pages
      - name: Check generated Pages artifacts
        run: git diff --exit-code -- docs/index.html docs/main.css
