name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Test CLJC
        run: clojure -M:test
      - name: Lint
        run: clojure -M:lint
      - name: Coverage gate
        run: clojure -M:coverage && clojure -M:coverage-thresholds
      - name: Build GitHub Pages
        run: clojure -M:pages
      - name: Check generated Pages artifacts
        run: git diff --exit-code -- docs/index.html docs/main.css
